<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Вход — рабочие инструменты</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#eef2f7}*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px}.box{width:min(420px,100%);background:#fff;border:1px solid #dce3ed;border-radius:18px;padding:30px;box-shadow:0 18px 55px rgba(25,42,70,.12)}h1{margin:0 0 8px;font-size:26px}.muted{color:#667085;margin:0 0 24px}.field{margin:14px 0}.field label{display:block;font-weight:650;margin-bottom:7px}.field input{width:100%;padding:12px 13px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px}.field input:focus{outline:2px solid #93b4ff;border-color:#3b6fd8}button{width:100%;border:0;border-radius:10px;background:#285fc5;color:#fff;padding:13px;font-size:16px;font-weight:700;cursor:pointer}.error{background:#fff1f2;color:#9f1239;border:1px solid #fecdd3;border-radius:10px;padding:11px;margin-bottom:16px}.note{font-size:13px;color:#7b8494;margin-top:18px;text-align:center}
</style></head><body><main class="box"><h1>Рабочие инструменты</h1><p class="muted">Войдите под учётной записью сотрудника.</p>
{% if form.errors %}<div class="error">Неверный логин или пароль.</div>{% endif %}
<form method="post">{% csrf_token %}<input type="hidden" name="next" value="{{ next }}">
<div class="field"><label for="id_username">Логин</label><input id="id_username" name="username" autocomplete="username" autofocus required></div>
<div class="field"><label for="id_password">Пароль</label><input id="id_password" type="password" name="password" autocomplete="current-password" required></div>
<button type="submit">Войти</button></form><div class="note">Доступ к генераторам закрыт общей Django-авторизацией.</div></main></body></html>
